spring.application.name=backend
spring.main.banner-mode=off

# Lazy loading para arrancar en < 2 segundos
#spring.main.lazy-initialization=true

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Inicialización (Cámbialo a 'never' tras la primera ejecución exitosa)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop

# Debugging (Solo ponlo en true si necesitas ver el error exacto)
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.tool.schema=ERROR
logging.level.org.springframework.web=DEBUG

# Seguridad
jwt.secret=${JWT_SECRET}
jwt.refresh-expiration-ms=86400000

# Admin Inicial
initial.admin.username=${INITIAL_ADMIN_USERNAME}
initial.admin.password=${INITIAL_ADMIN_PASSWORD}
initial.admin.email=${INITIAL_ADMIN_EMAIL}

# Actuator
management.endpoints.web.exposure.include=mappings

# Jackson
#spring.jackson.serialization.write-dates-as-timestamps=false